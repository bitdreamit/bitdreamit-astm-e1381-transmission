name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Verify Java source compiles (shared module - no Mirth deps)
        run: |
          mkdir -p out/shared
          javac -d out/shared -sourcepath shared/src $(find shared/src -name "*.java")
          echo "Shared module compiled successfully."
          find out/shared -name "*.class" -exec echo "  {}" \;

      - name: Verify package declarations match directory structure
        run: |
          set -e
          for f in $(find . -name "*.java" -not -path "./out/*"); do
            expected_pkg=$(dirname "$f" | sed 's|^\./[^/]*/src/||; s|/|.|g')
            actual_pkg=$(grep -E '^package ' "$f" | head -1 | sed 's|^package ||; s|;.*||')
            if [ "$expected_pkg" != "$actual_pkg" ]; then
              echo "MISMATCH in $f"
              echo "  expected: $expected_pkg"
              echo "  actual:   $actual_pkg"
              exit 1
            fi
          done
          echo "All package declarations match directory structure."

      - name: Verify no stale com.bitdreamit.mirth.astm references
        run: |
          if grep -r "com.bitdreamit.mirth.astm" --include="*.java" --include="*.xml" --include="*.iml" . ; then
            echo "Found stale references to the old package."
            exit 1
          fi
          echo "No stale package references found."

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-classes-jdk${{ matrix.java }}
          path: out/
          retention-days: 7
